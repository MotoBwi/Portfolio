<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#121013" />
    <title>Bapan Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Caveat+Brush&family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" />
    <script>
      /* Content stays hidden until the build engine boots. If React fails to start, show everything. */
      document.documentElement.classList.add('js');
      setTimeout(function () {
        if (!window.__ok) document.documentElement.classList.remove('js');
      }, 4000);
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
